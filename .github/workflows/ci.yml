# What a bare checkout has to pass: no bundle, no soundtrack, no GPU. That is
# what the split buys -- everything below the model is ordinary Rust, and it is
# checked on every push rather than only on the machine that ships. Both
# platforms the release packs are built here, so a Linux-only link error is
# found on a push and not on a tag. Each one links the ONNX Runtime its own
# packages carry -- the `ort` crate's prebuilt on Windows, Microsoft's NuGet
# `gpu.linux` package on Linux -- because that is which build is being checked.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A run that only ever starts by itself cannot be tested. This is the button
  # that says "run it now", and it is also what proves the workflow is wired up
  # at all: a repository whose push events never fire looks identical, from the
  # outside, to one whose workflow is broken.
  workflow_dispatch:
  # A backstop, not a substitute. On 2026-10-20 this repository's push events
  # reached GitHub -- the event feed carries `refs/heads/main` with the right
  # head -- and still started no run, while a manual dispatch ran the same file
  # to green on both platforms. Whatever suppresses the push trigger, a daily
  # run means main cannot go unchecked for longer than a day even so. It only
  # ever runs the default branch, and GitHub disables it after 60 days without
  # a commit, which is itself a signal that nobody is pushing.
  schedule:
    - cron: '0 3 * * *'

# Read the tree, run the tests, report. Nothing here writes to the repository.
permissions:
  contents: read

# A push while a run is in flight supersedes it: the point is to know whether
# what is on main right now passes, not what passed four pushes ago.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    # A hung job holds a runner until someone notices. Neither platform needs
    # anywhere near this: the slowest step is the first dependency build.
    timeout-minutes: 60
    steps:
      # Full history and the tags, not the depth-1 slice checkout defaults to.
      # The version this build would show has a fourth part counted from
      # `spans-base`, so a shallow clone cannot name the build it just made.
      # The whole repository is ~1 MB, so there is nothing to save here.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # The audio crate links ALSA on Linux; the runner image carries the
      # headers only when asked.
      - name: Linux build packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      # Off Windows there is ONE runtime a build can link, and until 2026-11-08
      # this step fetched it from a GitHub release. That release is gone: the
      # whole `microsoft/onnxruntime` repository answers 404 now, on this machine
      # and through the proxy, while `microsoft/vscode` and `pykeio/ort` answer
      # 200 -- so every Linux job died here with `curl: (22)` before reaching the
      # compiler, which is the red half of a two-platform matrix.
      #
      # The same binaries are still published, as NuGet packages, from Microsoft.
      # `gpu.linux` carries `runtimes/linux-x64/native/`: libonnxruntime.so, the
      # CUDA and TensorRT providers, and the shared provider stub -- the same
      # file set the old tarball held, so the link is unchanged (dynamic, which
      # is what a Linux release does too). 1.28.0 rather than 1.28.1: NuGet went
      # from 1.28.0 straight to 1.29.0, and the ONNX Runtime C API is stable
      # across a patch -- ort-sys rc.13 is built against api-28 either way.
      - name: Fetch Microsoft's ONNX Runtime
        if: runner.os == 'Linux'
        shell: bash
        env:
          ORT_VER: 1.28.0
        run: |
          set -eu
          mkdir -p ort
          pkg=microsoft.ml.onnxruntime.gpu.linux
          curl -fsSL -o ort/a.nupkg \
            "https://api.nuget.org/v3-flatcontainer/$pkg/$ORT_VER/$pkg.$ORT_VER.nupkg"
          unzip -q ort/a.nupkg 'runtimes/linux-x64/native/*' -d ort
          lib=$(cd ort/runtimes/linux-x64/native && pwd)
          test -f "$lib/libonnxruntime.so"
          # The tarball this used to come from carried both names --
          # `libonnxruntime.so` and the `libonnxruntime.so.1` its SONAME asks
          # for. The NuGet package carries only the first, so a binary linked
          # against it records `libonnxruntime.so.1` in its DT_NEEDED and every
          # run then dies with "cannot open shared object file" although the
          # library is right there under a different name. Give every object its
          # SONAME as a second name, read from the object rather than guessed --
          # with a pinned fallback, so this does not depend on binutils being on
          # the image. The extra names matter twice over: `ort-sys` symlinks
          # everything here into `target/debug{,/deps}`, which is the search path
          # cargo hands the test binary.
          have_readelf=0
          if command -v readelf >/dev/null 2>&1; then have_readelf=1; fi
          for f in "$lib"/*.so; do
            soname=""
            if [ "$have_readelf" = 1 ]; then
              soname=$(readelf -d "$f" | sed -n 's/.*SONAME.*\[\(.*\)\].*/\1/p' || true)
            fi
            if [ -z "$soname" ]; then soname=$(basename "$f").1; fi
            if [ ! -e "$lib/$soname" ]; then ln -s "$(basename "$f")" "$lib/$soname"; fi
          done
          ls -l "$lib"
          echo "ORT_LIB_LOCATION=$lib" >> "$GITHUB_ENV"
          # The package ships no static or import library for Linux, only the
          # .so, and ort-sys links a lib folder statically unless it is told
          # otherwise -- it looks for libonnxruntime.a, finds none, and says it
          # "could not link".
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
          # With dynamic linking `ort-sys` then symlinks every shared object it
          # found into three places beside the binary: `target/<profile>`, and
          # `examples` and `deps` under it. On unix that symlink has no copy
          # fallback and no `create_dir_all` -- `dynamic_link.rs:45` unwraps it
          # -- so a directory that is not there is a panic from the build
          # script, reported as `Os { code: 2, kind: NotFound }` with no file
          # named. `deps` cargo makes by itself; `examples` only exists when the
          # package has examples, and this one has none. Make the holes first.
          mkdir -p target/debug/examples target/debug/deps

      # The workspace, so xtask is built too -- it is what packs a release, and
      # a dist run that does not compile is found at the worst moment.
      - name: Build
        run: cargo build --workspace --all-targets

      # The Windows CUDA package is a build of its own, and its provider code
      # sits behind `#[cfg(feature = "cuda")]` -- which the build above does
      # not compile at all on Windows. Without this, a break in that path would
      # wait for a release tag to show itself. It links the `ort` crate's own
      # runtime here: a release links Microsoft's instead, but that is which
      # cards it reaches, not whether the code compiles.
      - name: Build the CUDA variant
        if: runner.os == 'Windows'
        run: cargo build --features cuda

      - name: Test
        run: cargo test --workspace
